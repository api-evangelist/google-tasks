naftiko: 1.0.0-alpha2
info:
  label: Google Tasks API
  description: The Google Tasks API lets you search, read, and update Google Tasks content and metadata. You can manage task
    lists and individual tasks, including creating, updating, moving, and deleting tasks programmatically.
  tags:
  - Google
  - Tasks
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-tasks
    baseUri: https://tasks.googleapis.com/tasks/v1
    description: Google Tasks API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_TASKS_TOKEN}}'
    resources:
    - name: users-me-lists
      path: /users/@me/lists
      operations:
      - name: listtasklists
        method: GET
        description: List task lists
        inputParameters:
        - name: maxResults
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: inserttasklist
        method: POST
        description: Create a task list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-me-lists-tasklistid
      path: /users/@me/lists/{taskListId}
      operations:
      - name: gettasklist
        method: GET
        description: Get a task list
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatetasklist
        method: PUT
        description: Update a task list
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchtasklist
        method: PATCH
        description: Patch a task list
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletetasklist
        method: DELETE
        description: Delete a task list
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lists-tasklistid-tasks
      path: /lists/{taskListId}/tasks
      operations:
      - name: listtasks
        method: GET
        description: List tasks
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        - name: maxResults
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        - name: showCompleted
          in: query
          type: boolean
        - name: showHidden
          in: query
          type: boolean
        - name: dueMin
          in: query
          type: string
        - name: dueMax
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: inserttask
        method: POST
        description: Create a task
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        - name: parent
          in: query
          type: string
        - name: previous
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lists-tasklistid-tasks-taskid
      path: /lists/{taskListId}/tasks/{taskId}
      operations:
      - name: gettask
        method: GET
        description: Get a task
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        - name: taskId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatetask
        method: PUT
        description: Update a task
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        - name: taskId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletetask
        method: DELETE
        description: Delete a task
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        - name: taskId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lists-tasklistid-tasks-taskid-move
      path: /lists/{taskListId}/tasks/{taskId}/move
      operations:
      - name: movetask
        method: POST
        description: Move a task
        inputParameters:
        - name: taskListId
          in: path
          type: string
          required: true
        - name: taskId
          in: path
          type: string
          required: true
        - name: parent
          in: query
          type: string
        - name: previous
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lists-tasklistid-clear
      path: /lists/{taskListId}/clear
